[package]
name = "fsspec_browser_py"
version = "0.3.0"
edition = "2021"
publish = false

[lib]
name = "fsspec_browser"
path = "rust/python/lib.rs"
crate-type = ["cdylib"]

[dependencies]
fsspec_browser_core = { package = "fsspec_browser", path = "./rust", version = "*", features = ["browser"] }
fsspec_rs = "0.2.1"
fsspec_rs_bridge = "0.2.1"
fsspec_sys = { version = "0.2.1", optional = true }
pyo3 = { version = "0.30.1", features = ["abi3", "extension-module", "multiple-pymethods"] }
serde_json = "1"

[features]
default = ["capi"]
# Resolve URLs through the shared libfsspec; `direct` keeps a registry inside this extension (Pyodide).
capi = ["dep:fsspec_sys"]
direct = []

[profile.release]
panic = 'abort'
lto = true

[workspace]
members = [
    "rust",
]
